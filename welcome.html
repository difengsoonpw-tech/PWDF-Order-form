<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastry World · New Customers</title>
<meta name="description" content="Wholesale cakes, macarons, croissants and bread for cafés, restaurants, hotels and caterers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root {
  --cream: #FBF7EF;
  --cream2: #F4EDDF;
  --gold: #D4A92C;
  --gold-dark: #B38B17;
  --dark: #2A2118;
  --dark2: #3A3128;
  --muted: #8A7B5C;
  --line: #E8DFCC;
  --white: #FFFFFF;
  --wa: #25D366;
  --wa-dark: #1DA851;
  --error: #B42318;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Karla, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--cream);
  color: var(--dark);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
.serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ============ TOP BAR ============ */
.topbar {
  position: sticky; top: 0; z-index: 500;
  background: var(--dark); color: var(--cream);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; height: 62px; }
.brand { display: flex; align-items: center; text-decoration: none; }
.brand img { height: 26px; }
.brand .brand-text { font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; }
.topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.pill-link {
  text-decoration: none; font-size: 12.5px; color: var(--cream);
  border: 1px solid #4A3F32; border-radius: 999px; padding: 8px 14px; white-space: nowrap;
}
.pill-link:hover { border-color: var(--gold); color: var(--gold); }
.pill-link.solid { background: var(--gold); border-color: var(--gold); color: var(--dark); font-weight: 600; }
.pill-link.solid:hover { background: var(--cream); border-color: var(--cream); color: var(--dark); }

/* ============ HERO ============ */
.hero { padding: 56px 0 64px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
.eyebrow {
  font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--gold-dark); font-weight: 700; margin: 0 0 14px;
}
.hero h1 { font-size: clamp(40px, 5.4vw, 64px); line-height: 1.02; margin: 0 0 18px; letter-spacing: -.01em; }
.hero p.sub { font-size: 17px; color: var(--dark2); max-width: 30em; margin: 0 0 28px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 9px; justify-content: center;
  font-family: Karla, sans-serif; font-size: 15px; font-weight: 700;
  padding: 14px 22px; border-radius: 999px; border: 1.5px solid transparent;
  text-decoration: none; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.btn-wa { background: var(--wa); color: #fff; }
.btn-wa:hover { background: var(--wa-dark); }
.btn-ghost { background: transparent; color: var(--dark); border-color: var(--dark); }
.btn-ghost:hover { background: var(--dark); color: var(--cream); }
.btn-dark { background: var(--dark); color: var(--cream); }
.btn-dark:hover { background: var(--dark2); }
.btn[disabled] { opacity: .6; cursor: wait; }

.hero-photos { display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; aspect-ratio: 1.15 / 1; }
.hero-photos .ph { background: var(--white); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(42,33,24,.08); }
.hero-photos .ph img { width: 100%; height: 100%; object-fit: cover; }
.hero-photos .ph:first-child { grid-row: 1 / 3; }

/* ============ SECTIONS ============ */
section { padding: 64px 0; }
.section-head { max-width: 640px; margin: 0 0 32px; }
.section-head h2 { font-size: clamp(32px, 4vw, 44px); line-height: 1.05; margin: 0 0 10px; }
.section-head p { margin: 0; color: var(--muted); font-size: 16px; }
.band { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* Product range */
.range-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.range-card {
  background: var(--white); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s;
}
.range-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(42,33,24,.09); }
.range-card .img { aspect-ratio: 1 / 1; background: var(--white); overflow: hidden; }
.range-card .img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.range-card:hover .img img { transform: scale(1.04); }
.range-card .body { padding: 14px 16px 18px; border-top: 1px solid var(--line); }
.range-card h3 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 4px; }
.range-card p { margin: 0; font-size: 14px; color: var(--muted); }

/* Reasons */
.reasons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.reason { border-top: 2px solid var(--gold); padding-top: 18px; }
.reason .num { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; color: var(--gold-dark); }
.reason h3 { font-size: 18px; margin: 6px 0 6px; }
.reason p { margin: 0; color: var(--muted); font-size: 15px; }

/* Lead form */
.lead { background: var(--dark); color: var(--cream); }
.lead .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 48px; align-items: start; }
.lead .section-head p { color: #C9BC9F; }
.lead-side .btn { margin-top: 8px; }
.lead-side .or { color: #9A8B6B; font-size: 13px; margin: 22px 0 8px; letter-spacing: .08em; text-transform: uppercase; }
.card-form { background: var(--cream); color: var(--dark); border-radius: 18px; padding: 26px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; }
.field label .opt { font-weight: 400; color: var(--muted); }
.field input, .field select, .field textarea {
  font-family: Karla, sans-serif; font-size: 15px; color: var(--dark);
  background: var(--white); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.field .hint { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-block; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--white); font-size: 13.5px; cursor: pointer; user-select: none;
}
.chip input:checked + span { background: var(--dark); border-color: var(--dark); color: var(--cream); }
.chip input:focus-visible + span { outline: 2px solid var(--gold); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-error { color: var(--error); font-size: 14px; margin: 0 0 12px; display: none; }
.consent { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
.thanks { display: none; text-align: center; padding: 20px 6px; }
.thanks .tick {
  width: 56px; height: 56px; border-radius: 50%; background: var(--wa); color: #fff;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
}
.thanks h3 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 34px; margin: 0 0 6px; }
.thanks p { color: var(--muted); margin: 0 0 20px; }

/* Existing customer strip + footer */
.existing { text-align: center; }
.existing p { margin: 0 0 16px; font-size: 17px; }
footer { padding: 26px 0 90px; color: var(--muted); font-size: 13px; text-align: center; border-top: 1px solid var(--line); }

.floating-wa {
  position: fixed; bottom: 16px; right: 16px; width: 56px; height: 56px; border-radius: 50%;
  background: var(--wa); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18); z-index: 1400; text-decoration: none;
}

/* Placeholder text is highlighted so it's obvious what still needs writing */
.placeholder { background: rgba(212,169,44,.18); border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 3px; }
.lead .placeholder { background: rgba(212,169,44,.28); }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px) {
  .hero { padding: 32px 0 44px; }
  .hero .wrap, .lead .wrap { grid-template-columns: 1fr; gap: 32px; }
  .hero-photos { order: -1; aspect-ratio: 1.3 / 1; }
  .reasons { grid-template-columns: 1fr; gap: 22px; }
  section { padding: 48px 0; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .topbar .pill-link:not(.solid) { display: none; }
  .grid2 { grid-template-columns: 1fr; gap: 0; }
  .btn-row .btn { flex: 1 1 100%; }
  .range-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .range-card h3 { font-size: 19px; }
  .range-card p { font-size: 13px; }
  .range-card .body { padding: 10px 12px 14px; }
  .card-form { padding: 20px 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="welcome.html" aria-label="Pastry World">
      <img src="logo.png" alt="Pastry World" onerror="this.outerHTML='<span class=&quot;brand-text&quot;>Pastry World</span>'">
    </a>
    <div class="topbar-right">
      <a class="pill-link" href="#range">Our range</a>
      <a class="pill-link solid" href="index.html">Existing customer? Order here</a>
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <div class="hero">
    <div class="wrap">
      <div>
        <p class="eyebrow" data-text="hero.eyebrow"></p>
        <h1 class="serif" data-text="hero.headline"></h1>
        <p class="sub" data-text="hero.subline"></p>
        <div class="btn-row">
          <a class="btn btn-wa js-wa" href="#" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.3c0-.1-.2-.2-.5-.3z"/></svg>
            <span data-text="hero.primaryButton"></span>
          </a>
          <a class="btn btn-ghost" href="#lead"><span data-text="hero.secondaryButton"></span></a>
        </div>
      </div>
      <div class="hero-photos" id="heroPhotos"></div>
    </div>
  </div>

  <!-- PRODUCT RANGE -->
  <section class="band" id="range">
    <div class="wrap">
      <div class="section-head">
        <h2 class="serif" data-text="rangeTitle"></h2>
        <p data-text="rangeIntro"></p>
      </div>
      <div class="range-grid" id="rangeGrid"></div>
    </div>
  </section>

  <!-- WHY US -->
  <section>
    <div class="wrap">
      <div class="section-head"><h2 class="serif" data-text="whyTitle"></h2></div>
      <div class="reasons" id="reasons"></div>
    </div>
  </section>

  <!-- LEAD FORM -->
  <section class="lead" id="lead">
    <div class="wrap">
      <div class="lead-side">
        <div class="section-head">
          <h2 class="serif" data-text="formTitle"></h2>
          <p data-text="formIntro"></p>
        </div>
        <p class="or">Prefer to chat now?</p>
        <a class="btn btn-wa js-wa" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>
          Chat on WhatsApp
        </a>
      </div>

      <div class="card-form">
        <form id="leadForm" novalidate>
          <p class="form-error" id="formError" role="alert"></p>
          <div class="grid2">
            <div class="field">
              <label for="f-name">Your name</label>
              <input id="f-name" name="name" autocomplete="name" maxlength="80" required>
            </div>
            <div class="field">
              <label for="f-phone">WhatsApp number</label>
              <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 012-345 6789" maxlength="20" required>
            </div>
          </div>
          <div class="grid2">
            <div class="field">
              <label for="f-business">Business name</label>
              <input id="f-business" name="business" autocomplete="organization" maxlength="120" required>
            </div>
            <div class="field">
              <label for="f-type">Type of business</label>
              <select id="f-type" name="type"></select>
            </div>
          </div>
          <div class="field">
            <label for="f-area">Area / town <span class="opt">(optional)</span></label>
            <input id="f-area" name="area" placeholder="e.g. Shah Alam, Petaling Jaya" maxlength="80">
          </div>
          <div class="field">
            <label>Interested in <span class="opt">(tap all that apply)</span></label>
            <div class="chips" id="interestChips"></div>
          </div>
          <div class="field">
            <label for="f-msg">Anything else? <span class="opt">(optional)</span></label>
            <textarea id="f-msg" name="message" maxlength="500" placeholder="Quantities, delivery days, questions…"></textarea>
          </div>
          <!-- Leave empty: a hidden trap field that only spam bots fill in -->
          <div class="hp" aria-hidden="true">
            <label for="f-website">Website</label>
            <input id="f-website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button class="btn btn-dark" type="submit" id="submitBtn" style="width:100%"><span data-text="formButton"></span></button>
          <p class="consent">By sending, you agree we may contact you on WhatsApp about our products.</p>
        </form>

        <div class="thanks" id="thanks" role="status">
          <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
          <h3 data-text="thankYouTitle"></h3>
          <p data-text="thankYouText"></p>
          <a class="btn btn-wa js-wa" href="#" target="_blank" rel="noopener">Say hi on WhatsApp</a>
        </div>
      </div>
    </div>
  </section>

  <!-- EXISTING CUSTOMERS -->
  <section class="existing">
    <div class="wrap">
      <p>Already a customer?</p>
      <a class="btn btn-ghost" href="index.html">Go to the ordering page →</a>
    </div>
  </section>
</main>

<footer><div class="wrap" data-text="footerNote"></div></footer>

<a href="#" target="_blank" rel="noopener" class="floating-wa js-wa" aria-label="Chat on WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20.52 3.48A11.86 11.86 0 0012 0C5.37 0 .04 5.33.04 11.96c0 2.11.55 4.18 1.6 6.02L0 24l6.29-1.63A11.9 11.9 0 0012 23.92c6.63 0 11.96-5.33 11.96-11.96 0-3.2-1.24-6.2-3.44-8.48z" fill="#25D366"/>
    <path d="M17.3 14.1c-.3-.15-1.78-.88-2.06-.98-.28-.1-.48-.15-.68.15-.17.28-.66.98-.81 1.18-.15.2-.3.22-.57.07-.3-.15-1.27-.47-2.42-1.48-.9-.8-1.5-1.8-1.68-2.09-.18-.28-.02-.43.13-.57.13-.12.3-.3.45-.45.15-.15.2-.25.3-.42.1-.17.05-.33-.02-.48-.07-.15-.68-1.64-.93-2.24-.24-.58-.49-.5-.68-.51l-.58-.01c-.2 0-.52.07-.8.33-.28.26-1.06 1.04-1.06 2.53 0 1.5 1.09 2.95 1.24 3.15.15.2 2.14 3.45 5.2 4.83 3.06 1.38 3.06.92 3.62.86.56-.07 1.79-.73 2.04-1.44.25-.71.25-1.32.18-1.44-.08-.12-.28-.17-.58-.32z" fill="#fff"/>
  </svg>
</a>

<script src="welcome-content.js?v=1"></script>
<script src="google.js?v=3"></script>
<script>
(function () {
  const C = (typeof WELCOME_CONTENT !== "undefined" && WELCOME_CONTENT) || {};

  // Where did this visitor come from? e.g. welcome.html?src=namecard
  // (the QR code on your name card adds this, so you can see which
  //  leads came from the card versus Google, Facebook, etc.)
  const params = new URLSearchParams(location.search);
  const SOURCE = (params.get("src") || params.get("utm_source") || "website").slice(0, 40);

  // ---------- fill in text ----------
  function get(path) {
    return path.split(".").reduce((o, k) => (o == null ? o : o[k]), C);
  }
  function setText(el, value) {
    const text = String(value == null ? "" : value);
    el.textContent = text;
    el.classList.toggle("placeholder", /^\s*\[.*\]\s*$/.test(text));
  }
  document.querySelectorAll("[data-text]").forEach(el => setText(el, get(el.dataset.text)));

  // ---------- WhatsApp links ----------
  function waUrl(message) {
    const num = String(C.whatsappNumber || "").replace(/\D/g, "");
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(message || C.whatsappGreeting || "Hi!");
  }
  document.querySelectorAll(".js-wa").forEach(a => { a.href = waUrl(); });

  // ---------- hero photos ----------
  const hero = document.getElementById("heroPhotos");
  ((C.hero && C.hero.photos) || []).slice(0, 3).forEach((src, i) => {
    const d = document.createElement("div");
    d.className = "ph";
    const img = new Image();
    img.src = src; img.alt = ""; if (i) img.loading = "lazy";
    d.appendChild(img);
    hero.appendChild(d);
  });

  // ---------- product range ----------
  const grid = document.getElementById("rangeGrid");
  const chips = document.getElementById("interestChips");
  (C.categories || []).forEach(cat => {
    const card = document.createElement("article");
    card.className = "range-card";
    card.innerHTML = '<div class="img"><img loading="lazy" alt=""></div><div class="body"><h3></h3><p></p></div>';
    card.querySelector("img").src = cat.photo;
    card.querySelector("img").alt = cat.name;
    card.querySelector("h3").textContent = cat.name;
    setText(card.querySelector("p"), cat.text);
    grid.appendChild(card);

    const label = document.createElement("label");
    label.className = "chip";
    label.innerHTML = '<input type="checkbox" name="interest"><span></span>';
    label.querySelector("input").value = cat.name;
    label.querySelector("span").textContent = cat.name;
    chips.appendChild(label);
  });

  // ---------- reasons ----------
  const reasons = document.getElementById("reasons");
  (C.reasons || []).forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "reason";
    d.innerHTML = '<div class="num"></div><h3></h3><p></p>';
    d.querySelector(".num").textContent = String(i + 1).padStart(2, "0");
    setText(d.querySelector("h3"), r.title);
    setText(d.querySelector("p"), r.text);
    reasons.appendChild(d);
  });

  // ---------- business types ----------
  const typeSel = document.getElementById("f-type");
  typeSel.innerHTML = '<option value="">Choose one</option>';
  (C.businessTypes || []).forEach(t => {
    const o = document.createElement("option");
    o.value = o.textContent = t;
    typeSel.appendChild(o);
  });

  // ---------- lead form ----------
  const form = document.getElementById("leadForm");
  const errBox = document.getElementById("formError");
  const btn = document.getElementById("submitBtn");

  function showError(msg) { errBox.textContent = msg; errBox.style.display = "block"; }
  function clearError() { errBox.style.display = "none"; }

  function phoneDigits(raw) { return String(raw || "").replace(/\D/g, ""); }

  function collect() {
    const f = form.elements;
    return {
      name: f.name.value.trim(),
      phone: f.phone.value.trim(),
      business: f.business.value.trim(),
      type: f.type.value,
      area: f.area.value.trim(),
      interests: Array.from(form.querySelectorAll('input[name="interest"]:checked')).map(i => i.value),
      message: f.message.value.trim(),
      website: f.website.value,       // spam trap — real people leave it empty
      source: SOURCE
    };
  }

  // The same details as a WhatsApp message — used if the form can't reach
  // the Google Sheet, so a lead is never lost.
  function leadAsMessage(l) {
    return [
      "Hi! I'd like to know more about your products.",
      "Name: " + l.name,
      "Business: " + l.business + (l.type ? " (" + l.type + ")" : ""),
      l.area ? "Area: " + l.area : "",
      l.interests.length ? "Interested in: " + l.interests.join(", ") : "",
      l.message ? "Note: " + l.message : ""
    ].filter(Boolean).join("\n");
  }

  // Checks the Google Sheet script has the lead feature switched on
  // before sending anything, so an older script can never mistake a
  // lead for an order.
  async function leadEndpointReady() {
    if (typeof API_URL === "undefined") return false;
    try {
      const u = new URL(API_URL);
      u.searchParams.set("action", "leadformready");
      const r = await fetch(u.toString(), { cache: "no-cache" });
      const j = await r.json();
      return !!(j && j.success && j.leads);
    } catch (e) { return false; }
  }

  async function sendLead(lead) {
    if (!(await leadEndpointReady())) return { success: false, error: "not_ready" };
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "savelead", lead: lead })
    });
    return r.json();
  }

  function showThanks(lead) {
    form.style.display = "none";
    const t = document.getElementById("thanks");
    t.style.display = "block";
    t.querySelector(".js-wa").href = waUrl(leadAsMessage(lead));
    t.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    clearError();
    const lead = collect();
    const digits = phoneDigits(lead.phone);
    if (!lead.name) return showError("Please enter your name.");
    if (digits.length < 9 || digits.length > 13) return showError("Please enter a valid WhatsApp number, e.g. 012-345 6789.");
    if (!lead.business) return showError("Please enter your business name.");

    btn.disabled = true;
    const label = btn.querySelector("span");
    const oldLabel = label.textContent;
    label.textContent = "Sending…";
    try {
      const res = await sendLead(lead);
      if (res && res.success) {
        showThanks(lead);
      } else if (res && res.error && res.error !== "not_ready") {
        showError(res.error);
      } else {
        // Sheet not reachable: hand the lead over WhatsApp instead.
        window.open(waUrl(leadAsMessage(lead)), "_blank", "noopener");
        showThanks(lead);
      }
    } catch (e) {
      window.open(waUrl(leadAsMessage(lead)), "_blank", "noopener");
      showThanks(lead);
    } finally {
      btn.disabled = false;
      label.textContent = oldLabel;
    }
  });
})();
</script>
</body>
</html>
